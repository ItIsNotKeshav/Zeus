# Advisories `cargo audit` reports that have been read and judged, each with
# why it stays and when it goes. CI runs `cargo audit` on every pull request.

[advisories]
ignore = [
    # RUSTSEC-2026-0459 (CVE-2026-119375): SQLite before 3.54.0 can return
    # stale page-cache memory when it opens a database with a sibling `-wal`
    # file whose page size differs. Exploiting it needs both files planted
    # where Zeus opens them: its own archive, in the account's application
    # data folder, which anyone able to write there could read already.
    #
    # The fix the advisory names, libsqlite3-sys 0.39, does not reach Zeus:
    # Zeus builds `bundled-sqlcipher`, whose sqlcipher-src 419.0.6 still
    # bundles SQLite 3.53.4 (the locked 0.38.2 bundles 3.51.3). Remove this
    # entry with the rusqlite upgrade whose SQLCipher bundles SQLite 3.54.0
    # or later.
    "RUSTSEC-2026-0459",
]
