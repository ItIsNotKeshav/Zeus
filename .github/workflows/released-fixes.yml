name: Released fixes

# Settles the open issues a release fixed. release.yml publishes releases
# with the workflow's own token, which starts no other workflows, so run
# this by hand with the new tag after each release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose fixed issues to settle
        required: true
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  settle:
    uses: crmne/copilot-triage/.github/workflows/settle.yml@v0
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
      dry_run: ${{ inputs.dry_run || false }}
